name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Apply SEO enhancements
        run: python seo_patch.py
      - name: Apply participation form updates
        run: python participation_patch.py
      - name: Improve mobile venue layout
        run: python mobile_venue_patch.py
      - name: Place participation fee below venue details
        run: python fee_layout_patch.py
      - name: Add world convention price comparison
        run: python member_price_patch.py
      - name: Improve member portal notices and meeting message
        run: python member_portal_patch.py
      - name: Add September agenda to schedule page
        run: python schedule_agenda_patch.py
      - name: Send event signup buttons directly to forms
        run: python direct_entry_links_patch.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

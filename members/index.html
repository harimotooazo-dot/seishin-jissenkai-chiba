<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>塾生専用ログイン｜盛心実践会千葉</title><style>:root{--wine:#6b1f2b;--ink:#2b1c20;--muted:#74656a;--bg:#f8f4f5;--line:#e8dadd}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}.login-overlay{min-height:100vh;display:grid;place-items:center;padding:22px}.login-box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 18px 50px rgba(107,31,43,.12)}.eyebrow{color:#9b6a72;font-weight:900;letter-spacing:.13em;font-size:13px}.login-box h1{margin:7px 0 8px;font-size:32px}.login-box p{color:var(--muted);line-height:1.7;margin:0 0 22px}.login-box label{display:block;font-weight:800;margin:12px 0 5px}.login-box input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px}.login-box button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:var(--wine);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.login-box button:disabled{opacity:.6}.login-msg{min-height:28px;margin-top:12px!important;font-size:14px}.back{display:block;text-align:center;margin-top:12px;color:var(--muted);font-size:13px;text-decoration:none}</style></head><body>
<div class="login-overlay"><div class="login-box"><div class="eyebrow">MEMBERS ONLY</div><h1>塾生専用ログイン</h1><p>正式な塾生として登録されている方専用です。登録済みのメールアドレスとパスワードでログインしてください。</p><form id="loginForm"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">ログイン</button><p id="loginMsg" class="login-msg" role="status" aria-live="polite"></p></form><a class="back" href="reset-password.html">初めてのパスワード設定・再設定はこちら</a><a class="back" href="../">← 公式サイトへ戻る</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://dkgxoiaaavktfkyiytzk.supabase.co';
const SUPABASE_KEY='sb_publishable_rB2RnWFSQZ6M8x8bq18FuQ_KDwWXaTq';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('loginForm'),msg=document.getElementById('loginMsg'),button=document.getElementById('loginButton');
async function authorize(user){const {data,error}=await client.from('members').select('name,role,status').eq('user_id',user.id).maybeSingle();if(error||!data||data.status!=='active'){await client.auth.signOut();throw new Error('このアカウントは塾生専用ページを利用できません。');}window.location.replace('../member.html');}
async function checkSession(){const {data:{session}}=await client.auth.getSession();if(session){try{await authorize(session.user)}catch(e){msg.textContent=e.message}}}
form.addEventListener('submit',async(e)=>{e.preventDefault();msg.textContent='確認中です…';button.disabled=true;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await client.auth.signInWithPassword({email,password});if(error){msg.textContent='メールアドレスまたはパスワードを確認してください。';button.disabled=false;return;}try{await authorize(data.user)}catch(err){msg.textContent=err.message;button.disabled=false;}});checkSession();
</script></body></html>

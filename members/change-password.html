<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>パスワード変更｜盛心実践会千葉</title>
  <style>
    :root{--wine:#6b1f2b;--ink:#2b1c20;--muted:#74656a;--bg:#f8f4f5;--line:#e8dadd}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
    main{min-height:100vh;display:grid;place-items:center;padding:22px}
    .box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 18px 50px rgba(107,31,43,.12)}
    .eyebrow{color:#9b6a72;font-weight:900;letter-spacing:.13em;font-size:13px}
    h1{margin:7px 0 8px;font-size:28px}
    p{color:var(--muted);line-height:1.7;margin:0 0 18px}
    label{display:block;font-weight:800;margin:12px 0 5px}
    input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px}
    button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:var(--wine);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
    button:disabled{opacity:.6}
    .message{min-height:28px;margin:12px 0 0;font-size:14px}
    .back{display:block;text-align:center;margin-top:18px;color:var(--wine);font-size:14px}
    .help{border-top:1px solid var(--line);padding-top:16px;margin-top:18px;font-size:14px}.help a{color:var(--wine);font-weight:800;text-decoration:underline;text-underline-offset:3px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main><div class="box">
  <div class="eyebrow">MEMBERS ONLY</div>
  <h1>パスワード変更</h1>
  <p id="intro">初回ログイン後は、ご自身だけが知っているパスワードに変更してください。</p>
  <p id="loading" role="status">確認しています…</p>
  <form id="changeForm" hidden>
    <label for="currentPassword">現在のパスワード</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">新しいパスワード</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirmPassword">新しいパスワード（確認）</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
    <p>12文字以上で、他のサービスとは異なるパスワードを設定してください。</p>
    <button type="submit">パスワードを変更する</button>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </form>
  <p class="help">現在のパスワードを忘れた方は、<a href="mailto:harimoto_te@oazo7.jp?subject=%E7%9B%9B%E5%BF%83%E5%AE%9F%E8%B7%B5%E4%BC%9A%E5%8D%83%E8%91%89%20%E3%83%91%E3%82%B9%E3%83%AF%E3%83%BC%E3%83%89%E5%86%8D%E7%99%BA%E8%A1%8C%E3%81%AE%E7%9B%B8%E8%AB%87">事務局へご連絡ください</a>。メールにパスワードは書かないでください。</p>
  <a class="back" href="../member.html">← 塾生専用ページへ戻る</a>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient(
  'https://dkgxoiaaavktfkyiytzk.supabase.co',
  'sb_publishable_rB2RnWFSQZ6M8x8bq18FuQ_KDwWXaTq'
);
const form=document.getElementById('changeForm');
const message=document.getElementById('message');
const loading=document.getElementById('loading');
const intro=document.getElementById('intro');
let memberEmail;

async function checkMember(){
  const {data:{session},error}=await client.auth.getSession();
  if(error||!session){location.replace('./');return}
  const {data:member,error:memberError}=await client.from('members').select('status').eq('user_id',session.user.id).maybeSingle();
  if(memberError||!member||member.status!=='active'){
    await client.auth.signOut();
    location.replace('./');
    return;
  }
  memberEmail=session.user.email;
  loading.hidden=true;
  form.hidden=false;
}

form.addEventListener('submit',async(event)=>{
  event.preventDefault();
  const current=document.getElementById('currentPassword').value;
  const password=document.getElementById('newPassword').value;
  if(password===current){message.textContent='現在と異なるパスワードにしてください。';return}
  if(password!==document.getElementById('confirmPassword').value){message.textContent='確認用のパスワードが一致しません。';return}
  const button=form.querySelector('button');
  button.disabled=true;
  message.textContent='確認しています…';
  const {error:signInError}=await client.auth.signInWithPassword({email:memberEmail,password:current});
  if(signInError){message.textContent='現在のパスワードを確認してください。';button.disabled=false;return}
  const {error}=await client.auth.updateUser({password});
  if(error){message.textContent='変更できませんでした。しばらくしてからお試しください。';button.disabled=false;return}
  await client.auth.signOut();
  form.hidden=true;
  intro.textContent='パスワードを変更しました。新しいパスワードでログインしてください。';
  document.querySelector('.back').href='./';
  document.querySelector('.back').textContent='ログイン画面へ';
});
checkMember();
</script>
</body>
</html>

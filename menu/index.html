<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b3b67">

  <title>盛心実践会千葉｜メニュー</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: -apple-system, BlinkMacSystemFont,

        "Hiragino Sans", "Yu Gothic", "YuGothic", sans-serif;

      background: #f4f7fa;

      color: #102d49;

    }

    .page {

      max-width: 620px;

      min-height: 100vh;

      margin: 0 auto;

      background: #ffffff;

    }

    .hero {

      text-align: center;

      padding: 42px 20px 32px;

      background:

        linear-gradient(180deg, #eaf5ff 0%, #ffffff 100%);

      border-bottom: 1px solid #e1e8ef;

    }

    .small-title {

      font-size: 12px;

      letter-spacing: 0.16em;

      color: #55728c;

      margin-bottom: 12px;

      font-weight: 700;

    }

    h1 {

      margin: 0 0 18px;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

      font-size: 32px;

      letter-spacing: 0.04em;

      color: #0b355b;

    }

    .message-main {

      margin: 0;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

      font-size: 20px;

      font-weight: 700;

      line-height: 1.7;

    }

    .message-sub {

      margin: 5px 0 0;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

      font-size: 17px;

      line-height: 1.7;

      color: #31536f;

    }

    .menu {

      padding: 24px 16px 14px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

    }

    .menu a {

      min-height: 145px;

      padding: 22px 10px 18px;

      border-radius: 16px;

      text-decoration: none;

      text-align: center;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      box-shadow: 0 5px 16px rgba(11, 53, 91, 0.10);

      transition: transform 0.15s ease;

    }

    .menu a:active {

      transform: scale(0.97);

    }

    .blue {

      background: linear-gradient(145deg, #1264a3, #073a65);

      color: white;

    }

    .white {

      background: #ffffff;

      color: #0b3b67;

      border: 1px solid #dbe4ec;

    }

    .icon {

      font-size: 34px;

      margin-bottom: 10px;

    }

    .label {

      font-size: 18px;

      font-weight: 800;

      line-height: 1.3;

    }

    .desc {

      margin-top: 7px;

      font-size: 12px;

      line-height: 1.5;

      opacity: 0.82;

    }

    .motto {

      padding: 22px 20px 30px;

      text-align: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

      font-size: 15px;

      font-weight: 700;

      letter-spacing: 0.06em;

      line-height: 1.8;

      color: #173d60;

    }

    footer {

      background: #073a65;

      color: white;

      text-align: center;

      padding: 28px 15px 34px;

    }

    footer strong {

      display: block;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

      font-size: 20px;

      letter-spacing: 0.08em;

      margin-bottom: 6px;

    }

    footer span {

      font-size: 11px;

      letter-spacing: 0.14em;

      opacity: 0.8;

    }

    @media (max-width: 360px) {

      h1 {

        font-size: 27px;

      }

      .message-main {

        font-size: 18px;

      }

      .message-sub {

        font-size: 15px;

      }

      .menu a {

        min-height: 135px;

      }

      .label {

        font-size: 16px;

      }

    }

  </style>

</head>

<body>

<div class="page">

  <header class="hero">

    <div class="small-title">SEISHIN JISSENKAI CHIBA</div>

    <h1>盛心実践会千葉</h1>

    <p class="message-main">

      心を高め、経営を伸ばす。

    </p>

    <p class="message-sub">

      学びを実践へ、実践を成果へ。

    </p>

  </header>

  <main class="menu">

    <a class="blue"

       href="https://harimotooazo-dot.github.io/seishin-jissenkai-chiba/">

      <div class="icon">🌐</div>

      <div class="label">公式サイト</div>

      <div class="desc">盛心実践会千葉について</div>

    </a>

    <a class="white"

   href="../schedule.html">

      <div class="icon">📅</div>

      <div class="label">活動スケジュール</div>

      <div class="desc">今後の勉強会・イベント</div>

    </a>

    <a class="white"

       href="https://harimotooazo-dot.github.io/seishin-jissenkai-chiba/#members">

      <div class="icon">👥</div>

      <div class="label">会員ページ</div>

      <div class="desc">会員専用コンテンツ</div>

    </a>

  <a class="blue" href="https://harimotooazo-dot.github.io/seishin-jissenkai-chiba/entry.html">
  <div class="icon">📝</div>
  <div class="label">勉強会参加申込</div>
  <div class="desc">会員・オブザーバー共通</div>
</a>

  </main>

  

  <footer>

    <strong>盛心実践会千葉</strong>

    <span>SEISHIN JISSENKAI CHIBA</span>

  </footer>

</div>

</body>

</html>

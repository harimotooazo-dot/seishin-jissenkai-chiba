name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Apply SEO enhancements
        run: python seo_patch.py
      - name: Update observer registration links
        run: python -c "from pathlib import Path; old='https://forms.gle/R7KaSbq9iwH9X8Yq6'; new='https://tally.so/r/LZeJ4G'; [(lambda p: p.write_text(p.read_text(encoding='utf-8').replace(old,new),encoding='utf-8'))(p) for p in [Path('index.html'),Path('chiba-keieisha-benkyokai.html')] if p.exists()]"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

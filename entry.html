<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3b67">

  <title>勉強会・イベント参加申込｜盛心実践会千葉</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fa;
      color: #123f63;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "YuGothic",
        "Noto Sans JP",
        sans-serif;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 52px 20px 42px;
      background: linear-gradient(180deg, #edf7ff 0%, #ffffff 100%);
      border-bottom: 1px solid #dce7ef;
    }

    .english {
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #557c9c;
    }

    h1 {
      margin: 0;
      font-family: serif;
      font-size: 36px;
      letter-spacing: 0.05em;
      color: #0b416d;
    }

    .lead {
      margin: 18px 0 0;
      font-size: 17px;
      line-height: 1.8;
      color: #5c7890;
    }

    main {
      padding: 38px 24px 50px;
    }

    .section-title {
      margin: 0 0 28px;
      text-align: center;
      font-size: 23px;
      color: #0b416d;
    }

    .event {
      overflow: hidden;
      margin-bottom: 34px;
      background: #ffffff;
      border: 1px solid #dbe5ed;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(20, 60, 90, 0.08);
    }

    .event img {
      display: block;
      width: 100%;
      height: auto;
    }

    .event-content {
      padding: 27px 28px 30px;
    }

    .event-type {
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #7c94a8;
    }

    .event h2 {
      margin: 0 0 17px;
      font-size: 24px;
      line-height: 1.5;
      color: #0b416d;
    }

    .info {
      margin-bottom: 22px;
      color: #49677e;
      font-size: 16px;
      line-height: 1.9;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1477b8, #064a7d);
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 14px rgba(10, 80, 130, 0.18);
    }

    .button:hover {
      opacity: 0.9;
    }

    .back {
      margin-top: 42px;
      text-align: center;
    }

    .back a {
      color: #356886;
      text-decoration: none;
      font-weight: 600;
    }

    footer {
      padding: 34px 20px;
      background: #0b416d;
      color: white;
      text-align: center;
    }

    footer strong {
      display: block;
      margin-bottom: 10px;
      font-family: serif;
      font-size: 24px;
      letter-spacing: 0.08em;
    }

    footer span {
      font-size: 12px;
      letter-spacing: 0.2em;
      opacity: 0.75;
    }

    @media (max-width: 600px) {
      header {
        padding: 40px 18px 32px;
      }

      h1 {
        font-size: 28px;
      }

      .lead {
        font-size: 15px;
      }

      main {
        padding: 28px 16px 42px;
      }

      .section-title {
        font-size: 20px;
      }

      .event-content {
        padding: 22px 20px 25px;
      }

      .event h2 {
        font-size: 21px;
      }

      .info {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header>
    <div class="english">SEISHIN JISSENKAI CHIBA</div>

    <h1>勉強会・イベント参加申込</h1>

    <p class="lead">
      現在受付中の勉強会・イベントです。<br>
      参加する会を選んでお申し込みください。
    </p>
  </header>

  <main>

    <h2 class="section-title">現在受付中</h2>

    <!-- 9月度合同自主例会 -->
    <section class="event">

      <img
        src="2026-09-meeting-wide.png"
        alt="9月度合同自主例会">

      <div class="event-content">

        <div class="event-type">
          盛心実践会千葉・心を高める経営を伸ばす会 佐倉
        </div>

        <h2>
          9月度 合同自主例会
        </h2>

        <div class="info">
          2026年9月29日（火）18:00〜21:00<br>
          グリーンセミナールーム<br>
          オンライン参加あり
        </div>

        <a
          class="button"
          href="https://tally.so/r/LZeJ4G"
          target="_blank"
          rel="noopener">
          9月度合同自主例会に申し込む
        </a>

      </div>
    </section>


    <!-- 世界大会 -->
    <section class="event">

      <img
        src="2026-11-world-convention.png"
        alt="第六回 心を高める 経営を伸ばす 世界大会">

      <div class="event-content">

        <div class="event-type">
          心を高める 経営を伸ばす
        </div>

        <h2>
          第六回 世界大会
        </h2>

        <div class="info">
          2026年11月18日（水）<br>
          国立京都国際会館
        </div>

        <a
          class="button"
          href="https://tally.so/r/WOBDLL"
          target="_blank"
          rel="noopener">
          世界大会に申し込む
        </a>

      </div>
    </section>


    <div class="back">
      <a href="menu/">← メニューに戻る</a>
    </div>

  </main>


  <footer>
    <strong>盛心実践会千葉</strong>
    <span>SEISHIN JISSENKAI CHIBA</span>
  </footer>

</div>

</body>
</html>

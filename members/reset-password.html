<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>パスワード設定・再設定｜盛心実践会千葉</title>
  <style>
    :root{--wine:#6b1f2b;--ink:#2b1c20;--muted:#74656a;--bg:#f8f4f5;--line:#e8dadd}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
    main{min-height:100vh;display:grid;place-items:center;padding:22px}
    .box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 18px 50px rgba(107,31,43,.12)}
    .eyebrow{color:#9b6a72;font-weight:900;letter-spacing:.13em;font-size:13px}
    h1{margin:7px 0 8px;font-size:28px}
    p{color:var(--muted);line-height:1.7;margin:0 0 18px}
    label{display:block;font-weight:800;margin:12px 0 5px}
    input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px}
    button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:var(--wine);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
    button:disabled{opacity:.6}
    .message{min-height:28px;margin:12px 0 0;font-size:14px}
    .back{display:block;text-align:center;margin-top:18px;color:var(--wine);font-size:14px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main><div class="box">
  <div class="eyebrow">MEMBERS ONLY</div>
  <h1>パスワード設定・再設定</h1>
  <p id="intro">登録したメールアドレスへ、パスワード設定用のリンクを送ります。</p>
  <p id="loading" role="status">確認しています…</p>
  <form id="requestForm" hidden>
    <label for="email">登録したメールアドレス</label>
    <input id="email" type="email" autocomplete="email" required>
    <button type="submit">設定用メールを送る</button>
    <p id="requestMessage" class="message" role="status" aria-live="polite"></p>
  </form>
  <form id="changeForm" hidden>
    <label for="newPassword">新しいパスワード</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirmPassword">新しいパスワード（確認）</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
    <p>12文字以上で、他のサービスとは異なるパスワードを設定してください。</p>
    <button type="submit">パスワードを設定する</button>
    <p id="changeMessage" class="message" role="status" aria-live="polite"></p>
  </form>
  <a class="back" href="./">← ログイン画面へ戻る</a>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient(
  'https://dkgxoiaaavktfkyiytzk.supabase.co',
  'sb_publishable_rB2RnWFSQZ6M8x8bq18FuQ_KDwWXaTq'
);
const loading=document.getElementById('loading');
const intro=document.getElementById('intro');
const requestForm=document.getElementById('requestForm');
const changeForm=document.getElementById('changeForm');
const requestMessage=document.getElementById('requestMessage');
const changeMessage=document.getElementById('changeMessage');
const linkError=new URLSearchParams(location.hash.slice(1)).get('error_description');

async function showAppropriateForm(){
  const {data:{session},error}=await client.auth.getSession();
  loading.hidden=true;
  if(session&&!error){
    intro.textContent='新しいパスワードを設定してください。';
    changeForm.hidden=false;
    requestForm.hidden=true;
  }else{
    intro.textContent='登録したメールアドレスへ、パスワード設定用のリンクを送ります。';
    requestForm.hidden=false;
    changeForm.hidden=true;
    if(linkError)requestMessage.textContent='リンクが期限切れか無効です。メールを再送してください。';
  }
}

requestForm.addEventListener('submit',async(event)=>{
  event.preventDefault();
  const button=requestForm.querySelector('button');
  button.disabled=true;
  requestMessage.textContent='送信しています…';
  const email=document.getElementById('email').value.trim();
  const {error}=await client.auth.resetPasswordForEmail(email,{
    redirectTo:new URL('reset-password.html',location.href).href
  });
  requestMessage.textContent=error
    ? '送信できませんでした。しばらくしてからお試しください。'
    : '登録済みのメールアドレスには設定用のメールが届きます。受信箱をご確認ください。';
  button.disabled=false;
});

changeForm.addEventListener('submit',async(event)=>{
  event.preventDefault();
  const password=document.getElementById('newPassword').value;
  if(password!==document.getElementById('confirmPassword').value){
    changeMessage.textContent='確認用のパスワードが一致しません。';
    return;
  }
  const button=changeForm.querySelector('button');
  button.disabled=true;
  changeMessage.textContent='設定しています…';
  const {error}=await client.auth.updateUser({password});
  if(error){
    changeMessage.textContent='設定できませんでした。リンクを再送してお試しください。';
    button.disabled=false;
    return;
  }
  await client.auth.signOut();
  changeForm.hidden=true;
  intro.textContent='パスワードを設定しました。ログイン画面からお入りください。';
  changeMessage.textContent='';
});

client.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')setTimeout(showAppropriateForm,0);
});
showAppropriateForm();
</script>
</body>
</html>

name: Improve event structured data

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time structured data improvement workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Improve Event schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('seo_patch.py')
          s = p.read_text(encoding='utf-8')
          old = '''{"@context":"https://schema.org","@type":"Event","name":"2026年 盛心実践会千葉・心高会 佐倉 9月度合同自主例会","startDate":"2026-09-29T18:00:00+09:00","endDate":"2026-09-29T21:00:00+09:00","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","location":{"@type":"Place","name":"グリーンセミナールーム","address":{"@type":"PostalAddress","postalCode":"260-0015","addressRegion":"千葉県","addressLocality":"千葉市中央区","streetAddress":"富士見2丁目8-14 エキニア千葉4F","addressCountry":"JP"}},"organizer":{"@type":"Organization","name":"盛心実践会千葉","url":"https://harimotooazo-dot.github.io/seishin-jissenkai-chiba/"},"description":"千葉市で開催する経営者勉強会。稲盛経営12ヵ条 第4条『誰にも負けない努力をする』を複数の講話から学び、フィロソフィ『ベクトルを合わせる』、グループディスカッション、京セラ式コンパを行う合同自主例会。初めての方・オブザーバー参加可。"}'''
          new = '''{"@context":"https://schema.org","@type":"Event","name":"2026年 盛心実践会千葉・心高会 佐倉 9月度合同自主例会","startDate":"2026-09-29T18:00:00+09:00","endDate":"2026-09-29T21:00:00+09:00","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","image":["https://harimotooazo-dot.github.io/seishin-jissenkai-chiba/hero_group.webp"],"location":{"@type":"Place","name":"グリーンセミナールーム","address":{"@type":"PostalAddress","postalCode":"260-0015","addressRegion":"千葉県","addressLocality":"千葉市中央区","streetAddress":"富士見2丁目8-14 エキニア千葉4F","addressCountry":"JP"}},"organizer":{"@type":"Organization","name":"盛心実践会千葉","url":"https://harimotooazo-dot.github.io/seishin-jissenkai-chiba/"},"offers":{"@type":"Offer","name":"オブザーバー参加","url":"https://forms.gle/R7KaSbq9iwH9X8Yq6","price":"5000","priceCurrency":"JPY","availability":"https://schema.org/InStock"},"description":"千葉市で開催する経営者勉強会。稲盛経営12ヵ条 第4条『誰にも負けない努力をする』を複数の講話から学び、フィロソフィ『ベクトルを合わせる』、グループディスカッション、京セラ式コンパを行う合同自主例会。初めての方・オブザーバー参加可。"}'''
          if old not in s:
              raise SystemExit('target Event schema not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "harimotooazo-dot"
          git config user.email "harimoto.oazo@gmail.com"
          git add seo_patch.py
          git commit -m "Improve Event structured data"
          git push

name: Remove originality topic

on:
  push:
    paths:
      - '.github/workflows/remove-originality-topic.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update next meeting text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('① ベクトルを合わせる　② 独創性を重んじる', 'ベクトルを合わせる')
          s = s.replace('全員参加経営や独創性、高い目標', '全員参加経営や高い目標')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-originality-topic.yml
          git commit -m "Remove originality topic from next meeting"
          git push
